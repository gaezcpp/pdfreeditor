[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # asserts are the point of the test suite

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
# Test fixtures use obvious throwaway credentials on purpose.
"tests/*" = ["S105", "S106"]
