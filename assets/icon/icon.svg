<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Flat, not a gradient: the renderers that turn this into launcher assets
       do not all support gradients, and a launcher icon is seen at 48px. -->
  <rect width="1024" height="1024" fill="#B3261E"/>

  <!-- The page: a document with a folded corner. -->
  <path d="M296 208 h286 l150 150 v458 a40 40 0 0 1 -40 40 H296 a40 40 0 0 1 -40 -40 V248 a40 40 0 0 1 40 -40 z"
        fill="#FFFFFF"/>
  <path d="M582 208 l150 150 h-118 a32 32 0 0 1 -32 -32 z" fill="#F0C9C5"/>

  <!-- Text lines, with the third one cut short: the line being edited. -->
  <rect x="336" y="430" width="330" height="34" rx="17" fill="#8C1D18"/>
  <rect x="336" y="512" width="250" height="34" rx="17" fill="#D6A6A1"/>
  <rect x="336" y="594" width="150" height="34" rx="17" fill="#D6A6A1"/>

  <!-- The pencil, sitting on the line it is changing. -->
  <g transform="rotate(-45 690 610)">
    <rect x="646" y="470" width="88" height="230" rx="16" fill="#F2B23E"/>
    <rect x="646" y="470" width="88" height="46" rx="16" fill="#D2932A"/>
    <path d="M646 700 h88 l-44 78 z" fill="#3A2E2A"/>
    <path d="M668 742 h44 l-22 36 z" fill="#1C1613"/>
  </g>
</svg>
