# PDFree API uses the host's shared PostgreSQL service.
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      SERVE_WEB_APP: ${SERVE_WEB_APP:-true}
    volumes:
      - apivar:/app/var
      - ../build/web:/app/build/web:ro
    networks:
      - shared-services

volumes:
  apivar:

networks:
  shared-services:
    external: true
